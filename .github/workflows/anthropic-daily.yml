name: Anthropic daily

on:
  schedule:
    # 23:20 UTC == 08:20 KST. GitHub Actions cron은 항상 UTC.
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

# breaking과 daily가 같은 state 파일을 커밋하므로 직렬화한다.
# cancel-in-progress: false → 실행 중인 작업을 죽이지 않고 큐잉.
concurrency:
  group: anthropic-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync latest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash

      - name: Run daily bot
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python anthropic_pro.py --mode daily

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state/anthropic_posted.json)" ]]; then
            git add state/anthropic_posted.json
            git commit -m "chore: update anthropic daily posted-state [skip ci]"
            git push
          else
            echo "No state change — skipping commit."
          fi
