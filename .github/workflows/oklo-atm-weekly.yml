name: OKLO ATM weekly

on:
  schedule:
    # 매주 월요일 08:23 KST (= 일요일 23:23 UTC). GitHub cron은 UTC 기준, 정각 혼잡 회피.
    - cron: "23 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oklo-atm-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 이 봇만 쓰는 카드 렌더링 패키지 — 글꼴은 저장소 fonts/ 에 포함, 다른 봇의 requirements는 건드리지 않음
          pip install matplotlib

      - name: Sync latest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash

      - name: Run OKLO ATM monitor
        env:
          OKLO_BOT_TOKEN: ${{ secrets.OKLO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SPACE8_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python oklo_atm_monitor.py

      - name: Commit state if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/oklo_atm_state.json)" ]]; then
            git add state/oklo_atm_state.json
            git commit -m "chore: update oklo atm state [skip ci]"
            git push
          else
            echo "No state change — skipping commit."
          fi
